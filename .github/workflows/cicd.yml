name: cicd

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fs-pokedex-main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fs-pokedex-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fs-pokedex-main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fs-pokedex-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run ESLint
        run: npm run eslint

      - name: Run tests
        run: npm test

      - name: Run Playwright tests
        run: npm run test:e2e

  deploy:
    name: Deploy to Render
    needs: test
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      !contains(github.event.head_commit.message, '[skip deploy]') &&
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set"
            exit 1
          fi

          separator="?"
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) separator="&" ;;
          esac

          curl --fail --request POST "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${GITHUB_SHA}"

  tag_release:
    name: Tag release
    needs: deploy
    permissions:
      contents: write
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      !contains(github.event.head_commit.message, '[skip tag]') &&
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create and push next patch tag
        run: |
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            NEXT_TAG="v1.0.0"
          else
            VERSION=${LATEST_TAG#v}
            MAJOR=${VERSION%%.*}
            REST=${VERSION#*.}
            MINOR=${REST%%.*}
            PATCH=${REST##*.}
            NEXT_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          git tag "$NEXT_TAG" "$GITHUB_SHA"
          git push origin "$NEXT_TAG"

  notify:
    name: Notify
    needs: [build, test, deploy, tag_release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify successful deployment
        if: needs.deploy.result == 'success' && needs.tag_release.result == 'success'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          jq -n \
            --arg commit_url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              username: "Pokedex CI/CD",
              embeds: [{
                title: "New version deployed",
                description: ("Commit: " + $commit_url + "\nWorkflow run: " + $run_url),
                color: 5763719
              }]
            }' |
            curl --fail-with-body --silent --show-error \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              "$DISCORD_WEBHOOK_URL"

      - name: Notify failed pipeline
        if: >
          needs.build.result == 'failure' ||
          needs.test.result == 'failure' ||
          needs.deploy.result == 'failure' ||
          needs.tag_release.result == 'failure'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          jq -n \
            --arg repository "${{ github.repository }}" \
            --arg commit "${{ github.sha }}" \
            --arg author "${{ github.actor }}" \
            --arg commit_url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              username: "Pokedex CI/CD",
              embeds: [{
                title: "Pipeline failed",
                description: (
                  "Repository: " + $repository +
                  "\nCommit: " + $commit +
                  "\nAuthor: " + $author +
                  "\nCommit details: " + $commit_url +
                  "\nWorkflow run: " + $run_url
                ),
                color: 15548997
              }]
            }' |
            curl --fail-with-body --silent --show-error \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              "$DISCORD_WEBHOOK_URL"

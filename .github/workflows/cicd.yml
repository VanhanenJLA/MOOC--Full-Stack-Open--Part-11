name: cicd

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fs-pokedex-main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fs-pokedex-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fs-pokedex-main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fs-pokedex-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run ESLint
        run: npm run eslint

      - name: Run tests
        run: npm test

      - name: Run Playwright tests
        run: npm run test:e2e

  deploy:
    name: Deploy to Render
    needs: test
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      !startsWith(github.event.head_commit.message, 'Bump version to v') &&
      !contains(github.event.head_commit.message, '[skip deploy]') &&
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set"
            exit 1
          fi

          separator="?"
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) separator="&" ;;
          esac

          curl --fail --request POST "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${GITHUB_SHA}"

  tag_release:
    name: Bump version and tag release
    needs: deploy
    permissions:
      contents: write
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      !startsWith(github.event.head_commit.message, 'Bump version to v') &&
      !contains(github.event.head_commit.message, '[skip tag]') &&
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fs-pokedex-main
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fs-pokedex-main/package-lock.json

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        run: npm version patch --no-git-tag-version

      - name: Commit version bump and create tag
        run: |
          VERSION=$(node -p "require('./package.json').version")

          git add package.json package-lock.json
          git commit -m "Bump version to v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:master
          git push origin "v${VERSION}"

  notify:
    name: Notify
    needs: [build, test, deploy, tag_release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify successful deployment
        if: needs.deploy.result == 'success' && needs.tag_release.result == 'success'
        uses: rjstone/discord-webhook-notify@v2.3.0
        with:
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: Pokedex CI/CD
          severity: info
          title: New version deployed
          details: |
            Commit: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notify failed pipeline
        if: >
          needs.build.result == 'failure' ||
          needs.test.result == 'failure' ||
          needs.deploy.result == 'failure' ||
          needs.tag_release.result == 'failure'
        uses: rjstone/discord-webhook-notify@v2.3.0
        with:
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: Pokedex CI/CD
          severity: error
          title: Pipeline failed
          details: |
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Commit details: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
